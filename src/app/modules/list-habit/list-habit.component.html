<app-filter-habits (searchHabits)="searchHabit($event)"></app-filter-habits>
@if (habits().length) {
  <div class="card-container">
    @for (habit of habits(); track habit.id) {
      <app-habit-card 
        [habit]="habit" >
      </app-habit-card>
    }
  </div>
} @else {
  <h1>Habits not found</h1>
}
