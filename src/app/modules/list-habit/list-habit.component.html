@if (habitService.hasInitialHabits) {
  <app-filter-habits (searchHabits)="searchHabit($event)"></app-filter-habits>

  <div class="habits-list">
    @if (habits().length) {
      <div class="habits-list__container">
        @for (habit of habits(); track habit.id) {
          <app-habit-card [habit]="habit"></app-habit-card>
        }
      </div>
    } @else {
      <h2 class="habits-list__message habits-list__message--no-search-results">No habits found for your search</h2>
    }
  </div>
} @else {
  <h2 class="habits-list__message habits-list__message--not-found">Habits not found</h2>
}
