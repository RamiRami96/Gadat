<div class="login">
  <mat-card class="login-card">
    <mat-card-header class="login__header">
      <mat-card-title>Login to Gadat</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form class="login__form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" required />
          @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
            <mat-error>Username is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required />
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <mat-error>Password is required</mat-error>
          }
        </mat-form-field>

        <div class="login__actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">Login</button>
        </div>

        @if (loginError) {
          <div class="login__credentials">
            <p class="login__error">{{ loginError }}</p>
          </div>
        }
      </form>
    </mat-card-content>
  </mat-card>
</div>
