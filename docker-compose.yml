services:
  postgres:
    image: postgres:16
    container_name: gadat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gadat
      POSTGRES_PASSWORD: gadat
      POSTGRES_DB: gadat
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - gadat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gadat -d gadat']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gadat-pgdata:
